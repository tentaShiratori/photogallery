allowBuilds:
  esbuild: true
  workerd: true
  ffmpeg-static: true
  sharp: true
minimumReleaseAgeExclude:
  - miniflare@5.20261012.1-beta
  - wrangler@4.151.1
  - "@cloudflare/vitest-plugin@1.4.4"
  - "@e2e-dev/web@0.15.3"
  - e2e@0.21.3
catalog:
  "@stylexjs/stylex": ^0.19.1
  "@stylexjs/unplugin": ^0.19.1
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/devtools-vite": ^0.8.6
  "@tanstack/react-devtools": ^0.10.14
  "@tanstack/react-router": ^1.170.46
  "@tanstack/react-router-devtools": ^1.167.2
  "@tanstack/react-start": ^1.169.4
  "@tanstack/router-cli": ^1.167.46
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.1.2
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest: 5.0.5
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  e2e:
    skills: true
  fallow:
    skills: true
