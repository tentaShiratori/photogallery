allowBuilds:
  esbuild: true
  workerd: true
  ffmpeg-static: true
  sharp: true
minimumReleaseAgeExclude:
  - miniflare@5.20261012.1-beta
  - wrangler@4.151.1
  - "@cloudflare/vitest-plugin@1.4.4"
  - "@e2e-dev/web@0.15.3"
  - e2e@0.21.3
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest: 5.0.5
  vite-plus: 1.3.0
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
permissions:
  e2e:
    skills: true
  fallow:
    skills: true
